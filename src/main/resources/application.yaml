server:
  error:
    # Error dispatches are public; never expose exception details, even via query parameters.
    include-exception: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-path: always

spring:
  application:
    name: co3103-g11-lms-instance
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lms_instance_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CENTRAL_IDENTITY_ISSUER_URI:http://localhost:8080}
          jwk-set-uri: ${CENTRAL_IDENTITY_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
