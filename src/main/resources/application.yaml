server:
  port: ${SERVER_PORT:8081}
  error:
    # Error dispatches are public; never expose exception details, even via query parameters.
    include-exception: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-path: always

spring:
  application:
    name: co3103-g11-lms-instance
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lms_instance_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      # Applies to application and Flyway connections. Refuse a connection if privacy settings fail.
      connection-init-sql: >-
        SET log_error_verbosity = 'terse';
        SET log_min_error_statement = 'panic';
        SET log_parameter_max_length_on_error = 0;
        SET log_statement = 'none';
        SET log_min_duration_statement = -1;
        SET log_min_duration_sample = -1;
        SET log_transaction_sample_rate = 0;

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CENTRAL_IDENTITY_ISSUER_URI:http://localhost:8080}
          jwk-set-uri: ${CENTRAL_IDENTITY_JWKS_URI:http://localhost:8080/.well-known/jwks.json}

lms:
  allowed-origins: ${LMS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  storage:
    class-thumbnails:
      directory: ${LMS_CLASS_THUMBNAIL_DIRECTORY:./var/class-thumbnails}
      public-base-url: ${LMS_PUBLIC_BASE_URL:http://localhost:8081}
