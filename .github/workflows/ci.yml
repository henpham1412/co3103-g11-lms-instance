name: LMS Instance CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build, test, and validate migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: lms_instance_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lms_instance_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/lms_instance_dev
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CENTRAL_IDENTITY_ISSUER_URI: http://localhost:8080
      CENTRAL_IDENTITY_JWKS_URI: http://localhost:8080/.well-known/jwks.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify PostgreSQL 18.6 baseline (DOC-07)
        run: |
          version=$(docker exec "${{ job.services.postgres.id }}" \
            psql -X -U "$DB_USERNAME" -d lms_instance_dev -Atc "SHOW server_version_num;")
          echo "PostgreSQL server_version_num: $version"
          test "$version" = "180006"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Show Java version
        run: java --version

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run Maven build and tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Verify PostgreSQL constraint diagnostics omit profile data
        if: always()
        run: |
          docker logs "${{ job.services.postgres.id }}" > "$RUNNER_TEMP/lms-postgres.log" 2>&1
          # Real HTTP tests must exercise database failures; an empty log is not proof of redaction.
          python3 - "$RUNNER_TEMP/lms-postgres.log" <<'PY'
          import pathlib, sys
          log = pathlib.Path(sys.argv[1]).read_text()
          assert all(marker in log for marker in ('"reject_test_role"', '"reject_test_profile"')), 'Missing constraint-failure evidence'
          assert not any(marker in log for marker in ('Failing row contains', 'DATABASE_NAME_MARKER', 'database-pii@example.test')), 'PostgreSQL diagnostic privacy regression'
          print('PostgreSQL constraint diagnostics contain no profile canaries or failing-row details')
          PY
